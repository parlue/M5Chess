[platformio]
default_envs = m5stack_core2
src_dir = main

[env:m5stack_core2]
platform = espressif32@6.8.1
board = m5stack-core2
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.core2
monitor_speed = 115200
upload_speed = 460800
build_flags = -DVIRGIN_EMBEDDED=1 -DVIRGIN_CORE2=1 -DVIRGIN_USE_PSRAM=1 -DVIRGIN_EMBEDDED_HASH_KIB=1024 -DVIRGIN_EMBEDDED_MAX_PLY=20 -fstack-usage -DVIRGIN_CORE2_DIAGNOSTICS=1
